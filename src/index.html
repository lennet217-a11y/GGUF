<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GGUF Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,sans-serif;background:#0b1020;color:#eef2ff}header{padding:24px 30px;border-bottom:1px solid #252c43;display:flex;justify-content:space-between}h1{margin:0}.muted{color:#9aa5c1}.wrap{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#12192b;border:1px solid #27304a;border-radius:16px;padding:22px}.drop{border:1px dashed #53617f;padding:38px;text-align:center;border-radius:14px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#6d7cff;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#0c1324;padding:14px;border-radius:10px}.label{font-size:12px;color:#8f9ab5}.value{font-size:18px;margin-top:5px}.ok{color:#69e6a5}.warn{color:#ffd166}.full{grid-column:1/-1}</style></head><body><header><div><h1>GGUF Lab</h1><div class="muted">GGUF Inspector · Hardware Fit</div></div><div id="status" class="muted">Bereit</div></header><main class="wrap"><section class="card"><h2>Modell testen</h2><p class="muted">GGUF-Datei auswählen und Basisdaten prüfen.</p><div class="drop"><button class="btn" id="pick">GGUF auswählen</button><p id="file" class="muted">Noch kein Modell geladen</p></div></section><section class="card"><h2>Dein System</h2><div class="grid" id="system"></div></section><section class="card full"><h2>Modell-Spezifikation</h2><div class="grid" id="model"></div></section><section class="card full"><h2>Hardware-Einschätzung</h2><div id="fit" class="value muted">Lade ein GGUF-Modell.</div></section></main><script>const $=id=>document.getElementById(id);function stat(l,v){return '<div class="stat"><div class="label">'+l+'</div><div class="value">'+v+'</div></div>'}async function init(){const s=await window.ggufLab.systemSpecs();$('system').innerHTML=stat('CPU',s.cpu)+stat('Kerne',s.cores)+stat('RAM',s.ramGB+' GB')+stat('Freier RAM',s.freeRamGB+' GB')}$('pick').onclick=async()=>{try{const m=await window.ggufLab.pickGGUF();if(!m)return;$('file').textContent=m.file;$('status').textContent='GGUF erkannt';$('model').innerHTML=stat('Datei',m.file)+stat('Größe',(m.sizeBytes/1024**3).toFixed(2)+' GB')+stat('GGUF Version',m.version)+stat('Tensoren',m.tensors.toLocaleString('de-DE'))+stat('Metadaten',m.metadataCount.toLocaleString('de-DE'));const s=await window.ggufLab.systemSpecs(),need=m.sizeBytes/1024**3*1.15,good=s.ramGB>=need;$('fit').innerHTML='<span class="'+(good?'ok':'warn')+'">'+(good?'Voraussichtlich passend':'Wahrscheinlich zu wenig RAM')+'</span> · konservative RAM-Schätzung ≈ '+need.toFixed(1)+' GB.'}catch(e){$('status').textContent='Fehler';alert(e.message)}};init();</script></body></html>
