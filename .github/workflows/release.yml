name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release-v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            TAG="${GITHUB_REF_NAME#release-}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG" dist/*.exe --target "$GITHUB_SHA" --title "GGUF Lab $TAG" --generate-notes
